# Pre-commit hooks for Joke Emporium
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com for more information

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict, --python-version=3.13]
        additional_dependencies:
          - pydantic>=2.0.0
          - sqlmodel>=0.0.14
          - types-aiofiles
        exclude: ^(tests/|alembic/versions/)

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Fast local test run (only changed files impact)
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick
        entry: uv run pytest tests/ -x --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: false  # Only run if Python files changed
        stages: [pre-commit]

# Configuration
default_language_version:
  python: python3.13

# Skip these hooks if needed with: SKIP=mypy git commit
